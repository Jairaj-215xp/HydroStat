[build]
  command = "node scripts/generate-env.js"
  publish = "."

[build.environment]
  # Firebase web client configuration values are public identifiers, not backend secrets.
  # Security is enforced by Firebase Security Rules (firestore.rules, storage.rules).
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_PROJECT_ID,FIREBASE_API_KEY,FIREBASE_AUTH_DOMAIN,FIREBASE_STORAGE_BUCKET,FIREBASE_MESSAGING_SENDER_ID,FIREBASE_APP_ID,FIREBASE_MEASUREMENT_ID"


[functions]
  directory = "netlify/functions"

# Rewrite rule for public researcher handle profiles
[[redirects]]
  from = "/@*"
  to = "/profile.html?handle=:splat"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

