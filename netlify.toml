[build]
  command = "node scripts/generate-env.js"
  publish = "."

[build.environment]
  # Disable Netlify secrets scanning so public Firebase client IDs do not block the build.
  # Backend keys like GEMINI_API_KEY are accessed exclusively server-side in netlify/functions.
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_PROJECT_ID,FIREBASE_API_KEY,FIREBASE_AUTH_DOMAIN,FIREBASE_STORAGE_BUCKET,FIREBASE_MESSAGING_SENDER_ID,FIREBASE_APP_ID,FIREBASE_MEASUREMENT_ID"


[functions]
  directory = "netlify/functions"

# Rewrite rule for public researcher handle profiles
[[redirects]]
  from = "/@*"
  to = "/profile.html?handle=:splat"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

