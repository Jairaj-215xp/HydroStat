[build]
  command = "node scripts/generate-env.js"
  publish = "."

[functions]
  directory = "netlify/functions"

# Rewrite rule for public researcher handle profiles
[[redirects]]
  from = "/@*"
  to = "/profile.html?handle=:splat"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

