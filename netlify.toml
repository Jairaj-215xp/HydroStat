[build]
  command = "node scripts/generate-env.js"
  publish = "."

[build.environment]
  # Netlify Secrets Scanning is active. Omit known public client-side Firebase configuration parameters
  # and documentation/test files from secret matching to prevent false positives on public project IDs.
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_PROJECT_ID,FIREBASE_API_KEY,FIREBASE_AUTH_DOMAIN,FIREBASE_STORAGE_BUCKET,FIREBASE_MESSAGING_SENDER_ID,FIREBASE_APP_ID,FIREBASE_MEASUREMENT_ID"
  SECRETS_SCAN_OMIT_PATHS = "docs/**,test/**"


[functions]
  directory = "netlify/functions"

# Rewrite rule for public researcher handle profiles
[[redirects]]
  from = "/@*"
  to = "/profile.html?handle=:splat"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

